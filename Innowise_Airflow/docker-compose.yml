x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__FERNET_KEY: 'D5RsviWFPGWY5R_yNMQ1QLk_nCfyPQ1owDPoLNPz88Q='
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    # Airflow 3: tasks run through the Task SDK and call back into the API server.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    # Must be identical in every component that mints or validates a task JWT
    # (scheduler signs, api-server verifies) — a mismatch fails every task run.
    AIRFLOW__API_AUTH__JWT_SECRET: 'local-dev-only-jwt-secret'
    # SimpleAuthManager is the 3.x default; all_admins drops the login screen.
    # Local development only — never do this on anything reachable.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'True'
    
    # Default database connection
    AIRFLOW_CONN_MONGO_DEFAULT: '{"conn_type": "mongo", "host": "mongodb", "port": 27017,
      "login": "mongo", "password": "mongo", "extra": {"authSource": "admin"}}'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
    - ./scripts:/opt/airflow/scripts
  user: "${AIRFLOW_UID:-50000}:0"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: "no"

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-db-volume:/data/db
    restart: "no"

 
  # Uses the image's built-in _AIRFLOW_DB_MIGRATE hook instead of an
  # `entrypoint: /bin/bash` override: overriding entrypoint skips the image's
  # own /entrypoint script, which is what maps AIRFLOW_UID to HOME=/home/airflow.
  # Without it HOME defaults to "/" and `airflow` can't find its own package.
  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    restart: "no"
    depends_on: &airflow-common-depends-on
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: "no"
    depends_on: *airflow-common-depends-on

  # Airflow 3 parses DAG files in a standalone process — the scheduler no
  # longer does it, so without this service no DAG ever appears.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: "no"
    depends_on: *airflow-common-depends-on

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: "no"
    depends_on: *airflow-common-depends-on

volumes:
  postgres-db-volume:
  mongo-db-volume:
